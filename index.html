<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>heart by kurona</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a0a15 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        flex-direction: column;
        font-family: 'Arial', sans-serif;
    }

    .container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 60px;
    }

    /* ===== СЕРДЦЕ С ДЕТАЛЯМИ ===== */
    .heart-container {
        position: relative;
        width: 400px;
        height: 400px;
        animation: drawHeart 3s ease forwards;
        opacity: 0;
        filter: drop-shadow(0 0 30px rgba(255, 77, 166, 0.6));
    }

    svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 15px rgba(255, 77, 166, 0.8));
    }

    /* Главное сердце пульсирует */
    .heart-main {
        animation: heartBeat 1.5s ease-in-out 2.5s infinite;
    }

    @keyframes heartBeat {
        0% { transform: scale(1); }
        14% { transform: scale(1.1); }
        28% { transform: scale(1); }
        42% { transform: scale(1.08); }
        56% { transform: scale(1); }
        100% { transform: scale(1); }
    }

    /* Внутреннее сияние */
    .heart-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 180px;
        height: 180px;
        background: radial-gradient(circle, rgba(255, 77, 166, 0.4) 0%, transparent 70%);
        border-radius: 50%;
        animation: glowPulse 2s ease-in-out 2.5s infinite;
    }

    @keyframes glowPulse {
        0% { 
            box-shadow: 0 0 20px rgba(255, 77, 166, 0.4), inset 0 0 20px rgba(255, 77, 166, 0.2);
            transform: translate(-50%, -50%) scale(1);
        }
        50% { 
            box-shadow: 0 0 40px rgba(255, 77, 166, 0.8), inset 0 0 30px rgba(255, 77, 166, 0.4);
            transform: translate(-50%, -50%) scale(1.1);
        }
        100% { 
            box-shadow: 0 0 20px rgba(255, 77, 166, 0.4), inset 0 0 20px rgba(255, 77, 166, 0.2);
            transform: translate(-50%, -50%) scale(1);
        }
    }

    @keyframes drawHeart {
        0% { 
            stroke-dashoffset: 2000;
            opacity: 0;
            transform: scale(0.8);
        }
        100% { 
            stroke-dashoffset: 0;
            opacity: 1;
            transform: scale(1);
        }
    }

    /* ===== БУКВА S ПО ЦЕНТРУ ===== */
    .letter {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 120px;
        font-weight: bold;
        color: white;
        text-shadow: 
            0 0 10px #ff4da6,
            0 0 20px #ff4da6,
            0 0 30px #ff1493,
            0 0 50px #ff1493;
        opacity: 0;
        animation: letterFadeIn 2.5s ease 2.5s forwards, letterPulse 2s ease-in-out 2.5s infinite;
        z-index: 10;
    }

    @keyframes letterFadeIn {
        from { 
            opacity: 0; 
            transform: translate(-50%, -50%) scale(0.2) rotateZ(-20deg);
        }
        to { 
            opacity: 1; 
            transform: translate(-50%, -50%) scale(1) rotateZ(0deg);
        }
    }

    @keyframes letterPulse {
        0%, 100% { 
            transform: translate(-50%, -50%) scale(1);
            text-shadow: 
                0 0 10px #ff4da6,
                0 0 20px #ff4da6,
                0 0 30px #ff1493,
                0 0 50px #ff1493;
        }
        50% { 
            transform: translate(-50%, -50%) scale(1.15);
            text-shadow: 
                0 0 20px #ff4da6,
                0 0 30px #ff4da6,
                0 0 50px #ff1493,
                0 0 80px #ff1493;
        }
    }

    /* ===== ЧАСТИЦЫ ВОКРУГ СЕРДЦА ===== */
    .particle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: radial-gradient(circle at 30% 30%, #ff87c1, #ff1493);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        opacity: 0;
    }

    .particle.p1 { animation: particleFloat1 3s ease-out infinite; }
    .particle.p2 { animation: particleFloat2 3.5s ease-out infinite; }
    .particle.p3 { animation: particleFloat3 4s ease-out infinite; }
    .particle.p4 { animation: particleFloat4 3.5s ease-out infinite; }
    .particle.p5 { animation: particleFloat5 4s ease-out infinite; }

    @keyframes particleFloat1 {
        0% { transform: translate(-50%, -50%) translate(0, 0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(-50%, -50%) translate(60px, -80px); opacity: 0; }
    }

    @keyframes particleFloat2 {
        0% { transform: translate(-50%, -50%) translate(0, 0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(-50%, -50%) translate(-70px, -75px); opacity: 0; }
    }

    @keyframes particleFloat3 {
        0% { transform: translate(-50%, -50%) translate(0, 0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(-50%, -50%) translate(85px, 40px); opacity: 0; }
    }

    @keyframes particleFloat4 {
        0% { transform: translate(-50%, -50%) translate(0, 0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(-50%, -50%) translate(-80px, 50px); opacity: 0; }
    }

    @keyframes particleFloat5 {
        0% { transform: translate(-50%, -50%) translate(0, 0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(-50%, -50%) translate(0px, -100px); opacity: 0; }
    }

    /* ===== ДОПОЛНИТЕЛЬНЫЕ ЧАСТИЦЫ ===== */
    .particle-extra {
        position: absolute;
        width: 4px;
        height: 4px;
        background: radial-gradient(circle at 30% 30%, #ffb6d9, #ff87c1);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        opacity: 0;
    }

    .particle-extra.e1 { animation: particleFloat1 3s ease-out infinite; }
    .particle-extra.e2 { animation: particleFloat2 3.5s ease-out infinite; animation-delay: 0.5s; }
    .particle-extra.e3 { animation: particleFloat3 4s ease-out infinite; animation-delay: 1s; }
    .particle-extra.e4 { animation: particleFloat4 3.5s ease-out infinite; animation-delay: 1.5s; }
    .particle-extra.e5 { animation: particleFloat5 4s ease-out infinite; animation-delay: 0.8s; }
    .particle-extra.e6 { animation: particleFloat1 3.2s ease-out infinite; animation-delay: 1.2s; }
    .particle-extra.e7 { animation: particleFloat2 3.8s ease-out infinite; animation-delay: 0.3s; }
    .particle-extra.e8 { animation: particleFloat3 4.2s ease-out infinite; animation-delay: 1.8s; }

    /* ===== ОРБИТЫ ВОКРУГ СЕРДЦА ===== */
    .orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        opacity: 0.3;
        border: 1px solid rgba(255, 77, 166, 0.3);
        animation: orbitSpin 8s linear infinite;
    }

    .orbit.o1 {
        width: 280px;
        height: 280px;
        animation-duration: 8s;
    }

    .orbit.o2 {
        width: 360px;
        height: 360px;
        animation-duration: 12s;
        animation-direction: reverse;
        border-color: rgba(255, 135, 193, 0.2);
    }

    .orbit.o3 {
        width: 440px;
        height: 440px;
        animation-duration: 16s;
        border-color: rgba(255, 20, 147, 0.15);
    }

    @keyframes orbitSpin {
        0% { transform: translate(-50%, -50%) rotateZ(0deg); }
        100% { transform: translate(-50%, -50%) rotateZ(360deg); }
    }

    /* ===== ЗВЁЗДЫ НА ОРБИТАХ ===== */
    .star-orbit {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #ffb6d9;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        box-shadow: 0 0 8px #ffb6d9;
    }

    .star-orbit.s1 {
        animation: starOrbit1 8s linear infinite;
    }

    .star-orbit.s2 {
        animation: starOrbit1 8s linear infinite;
        animation-delay: 2s;
    }

    .star-orbit.s3 {
        animation: starOrbit1 8s linear infinite;
        animation-delay: 4s;
    }

    .star-orbit.s4 {
        animation: starOrbit1 8s linear infinite;
        animation-delay: 6s;
    }

    .star-orbit.s5 {
        animation: starOrbit2 12s linear infinite;
    }

    .star-orbit.s6 {
        animation: starOrbit2 12s linear infinite;
        animation-delay: 3s;
    }

    .star-orbit.s7 {
        animation: starOrbit2 12s linear infinite;
        animation-delay: 6s;
    }

    .star-orbit.s8 {
        animation: starOrbit2 12s linear infinite;
        animation-delay: 9s;
    }

    @keyframes starOrbit1 {
        0% { transform: translate(-50%, -50%) translateX(140px) rotateZ(0deg); }
        100% { transform: translate(-50%, -50%) translateX(140px) rotateZ(360deg); }
    }

    @keyframes starOrbit2 {
        0% { transform: translate(-50%, -50%) translateX(180px) rotateZ(0deg); }
        100% { transform: translate(-50%, -50%) translateX(180px) rotateZ(-360deg); }
    }

    /* ===== БОКОВЫЕ СЕРДЕЧКИ ===== */
    .side-hearts {
        position: absolute;
        top: 15%;
        left: 30px;
        font-size: 60px;
        animation: float 4s ease-in-out infinite;
        z-index: 5;
        filter: drop-shadow(0 0 15px rgba(255, 77, 166, 0.8));
    }

    .side-hearts.right {
        left: auto;
        right: 30px;
        animation-delay: 1.5s;
    }

    /* ===== БОКОВЫЕ ДЕКОРАЦИИ ===== */
    .side-decoration {
        position: absolute;
        font-size: 40px;
        z-index: 3;
        animation: decorFloat 5s ease-in-out infinite;
    }

    .side-decoration.left-top {
        top: 25%;
        left: 15px;
        animation-delay: 0.5s;
    }

    .side-decoration.left-bottom {
        bottom: 25%;
        left: 20px;
        animation-delay: 1s;
    }

    .side-decoration.right-top {
        top: 30%;
        right: 15px;
        animation-delay: 0.8s;
    }

    .side-decoration.right-bottom {
        bottom: 20%;
        right: 20px;
        animation-delay: 1.3s;
    }

    /* ===== ДОПОЛНИТЕЛЬНЫЕ ЗВЁЗДЫ ПО БОКАМ ===== */
    .side-star {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #ffb6d9;
        border-radius: 50%;
        box-shadow: 0 0 6px #ffb6d9;
        opacity: 0.8;
        animation: twinkle 2s ease-in-out infinite;
    }

    .side-star.s-l1 { top: 20%; left: 8px; animation-delay: 0s; }
    .side-star.s-l2 { top: 45%; left: 12px; animation-delay: 0.5s; }
    .side-star.s-l3 { top: 70%; left: 10px; animation-delay: 1s; }
    .side-star.s-r1 { top: 22%; right: 8px; animation-delay: 0.3s; }
    .side-star.s-r2 { top: 50%; right: 12px; animation-delay: 0.8s; }
    .side-star.s-r3 { top: 75%; right: 10px; animation-delay: 1.2s; }

    @keyframes twinkle {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
    }

    @keyframes decorFloat {
        0% { transform: translateY(0) scale(1); opacity: 0.7; }
        50% { transform: translateY(-20px) scale(1.15); opacity: 1; }
        100% { transform: translateY(0) scale(1); opacity: 0.7; }
    }

    @keyframes float {
        0% { transform: translateY(0) scale(1) rotateZ(0deg); opacity: 0.6; }
        50% { transform: translateY(-25px) scale(1.1) rotateZ(10deg); opacity: 1; }
        100% { transform: translateY(0) scale(1) rotateZ(0deg); opacity: 0.6; }
    }

    /* ===== БОКОВЫЕ SVG ЭЛЕМЕНТЫ ===== */
    .side-element {
        position: absolute;
        width: 50px;
        height: 50px;
        z-index: 4;
    }

    .side-element.left-top {
        top: 15%;
        left: 15px;
        animation: floatSide 4s ease-in-out infinite;
    }

    .side-element.left-bottom {
        bottom: 20%;
        left: 20px;
        animation: floatSide 4.5s ease-in-out infinite;
        animation-delay: 0.7s;
    }

    .side-element.right-top {
        top: 18%;
        right: 15px;
        animation: floatSide 4.2s ease-in-out infinite;
        animation-delay: 0.4s;
        transform: scaleX(-1);
    }

    .side-element.right-bottom {
        bottom: 25%;
        right: 20px;
        animation: floatSide 4.6s ease-in-out infinite;
        animation-delay: 1s;
        transform: scaleX(-1);
    }

    @keyframes floatSide {
        0% { transform: translateY(0) rotateZ(-5deg) scale(0.9); opacity: 0.7; }
        50% { transform: translateY(-20px) rotateZ(5deg) scale(1.05); opacity: 1; }
        100% { transform: translateY(0) rotateZ(-5deg) scale(0.9); opacity: 0.7; }
    }

    /* ===== ТЕКСТ С РОТАЦИЕЙ ===== */
    .text-container {
        position: fixed;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        width: 92%;
        max-width: 650px;
        z-index: 100;
        perspective: 1200px;
        height: auto;
    }

    .text-item {
        position: absolute;
        left: 0;
        right: 0;
        opacity: 0;
        animation: textAppear 5s ease-in-out infinite;
        text-align: center;
        pointer-events: none;
        z-index: 1;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        will-change: opacity, transform;
    }

    .text-item:nth-child(1) { animation-delay: 0s; z-index: 11; }
    .text-item:nth-child(2) { animation-delay: 5s; z-index: 12; }
    .text-item:nth-child(3) { animation-delay: 10s; z-index: 13; }
    .text-item:nth-child(4) { animation-delay: 15s; z-index: 14; }
    .text-item:nth-child(5) { animation-delay: 20s; z-index: 15; }

    .text-content {
        color: #ff5f9e;
        font-size: 26px;
        text-shadow: 
            0 0 20px #ff4d94,
            0 0 40px rgba(255, 77, 166, 0.9),
            0 0 60px rgba(255, 20, 147, 0.6);
        font-weight: 900;
        letter-spacing: 1px;
        line-height: 1.8;
        word-spacing: 4px;
        padding: 18px 25px;
        background: rgba(10, 10, 10, 0.85);
        border-radius: 25px;
        border: 2.5px solid rgba(255, 77, 166, 0.6);
        backdrop-filter: blur(15px);
        box-shadow: 
            0 0 30px rgba(255, 77, 166, 0.4),
            inset 0 0 20px rgba(255, 77, 166, 0.15);
    }

    .emoji-icon {
        font-size: 36px;
        margin: 0 10px;
        display: inline-block;
        animation: emojiPulse 2.5s ease-in-out infinite;
        filter: drop-shadow(0 0 8px rgba(255, 77, 166, 0.8));
        opacity: 0;
        will-change: opacity, transform;
    }

    .emoji-icon:first-child { animation-delay: 0s; }
    .emoji-icon:last-child { animation-delay: 0.4s; }

    @keyframes emojiPulse {
        0%, 100% { transform: scale(1) rotateZ(-5deg); opacity: 0; }
        5% { opacity: 1; }
        10% { transform: scale(1.25) rotateZ(5deg); opacity: 1; }
        50% { transform: scale(1.25) rotateZ(5deg); opacity: 1; }
        90% { transform: scale(1.25) rotateZ(5deg); opacity: 1; }
        95% { opacity: 1; }
        100% { transform: scale(1) rotateZ(-5deg); opacity: 0; }
    }

    @keyframes textAppear {
        0% { 
            opacity: 0;
            transform: translateY(80px) scale(0.5) rotateX(100deg);
            filter: blur(40px);
        }
        1% { 
            opacity: 0.5;
            transform: translateY(40px) scale(0.8) rotateX(50deg);
            filter: blur(20px);
        }
        2% { 
            opacity: 1;
            transform: translateY(0) scale(1) rotateX(0deg);
            filter: blur(0);
        }
        76% { 
            opacity: 1;
            transform: translateY(0) scale(1) rotateX(0deg);
            filter: blur(0);
        }
        78% {
            opacity: 0.5;
            transform: translateY(-40px) scale(0.8) rotateX(-50deg);
            filter: blur(20px);
        }
        100% { 
            opacity: 0;
            transform: translateY(-80px) scale(0.5) rotateX(-100deg);
            filter: blur(40px);
        }
    }
    
    @media (max-width: 768px) {
        .heart-container {
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
        }

        .letter {
            font-size: 80px;
        }

        .text-content {
            font-size: 20px;
            padding: 14px 18px;
        }

        .emoji-icon {
            font-size: 28px;
            margin: 0 6px;
        }

        .text-container {
            bottom: 40px;
            width: 90%;
        }

        .side-hearts {
            font-size: 45px;
            top: 10%;
            left: 15px;
        }

        .side-hearts.right {
            right: 15px;
        }

        .side-element {
            width: 40px;
            height: 40px;
        }

        .orbit.o1 {
            width: 220px;
            height: 220px;
        }

        .orbit.o2 {
            width: 280px;
            height: 280px;
        }

        .orbit.o3 {
            width: 340px;
            height: 340px;
        }
    }

    @media (max-width: 480px) {
        .heart-container {
            width: 240px;
            height: 240px;
        }

        .letter {
            font-size: 70px;
        }

        .text-content {
            font-size: 18px;
            padding: 12px 15px;
            letter-spacing: 0px;
            word-spacing: 2px;
        }

        .emoji-icon {
            font-size: 26px;
            margin: 0 5px;
        }

        .text-container {
            bottom: 35px;
            width: 95%;
        }

        .side-hearts {
            font-size: 40px;
            top: 8%;
        }

        .side-element {
            width: 35px;
            height: 35px;
        }

        .particle {
            width: 4px;
            height: 4px;
        }

        .orbit.o1 {
            width: 180px;
            height: 180px;
        }

        .orbit.o2 {
            width: 230px;
            height: 230px;
        }

        .orbit.o3 {
            width: 280px;
            height: 280px;
        }
    }

    /* ===== ТЕКСТ С РОТАЦИЕЙ ===== */
    .text-container {
        position: relative;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 80px;
        width: 100%;
        perspective: 1000px;
    }

    .text {
        color: #ff5f9e;
        font-size: 20px;
        text-shadow: 0 0 20px #ff4d94, 0 0 40px rgba(255, 77, 166, 0.5);
        font-weight: bold;
        opacity: 0;
        position: fixed;
        animation: textRotate 5s ease-in-out infinite;
        text-align: center;
        width: 85%;
        max-width: 500px;
        padding: 15px 20px;
        word-wrap: break-word;
        line-height: 1.6;
        left: 50%;
        bottom: 80px;
        transform: translateX(-50%);
        z-index: 100;
    }

    .text:nth-child(1) { animation-delay: 0s; }
    .text:nth-child(2) { animation-delay: 5s; }
    .text:nth-child(3) { animation-delay: 10s; }
    .text:nth-child(4) { animation-delay: 15s; }
    .text:nth-child(5) { animation-delay: 20s; }

    @keyframes textRotate {
        0% { 
            opacity: 0; 
            transform: translateX(-50%) translateY(60px) scale(0.6);
            filter: blur(15px);
        }
        3% { 
            opacity: 1; 
            transform: translateX(-50%) translateY(0) scale(1);
            filter: blur(0);
        }
        82% { 
            opacity: 1; 
            transform: translateX(-50%) translateY(0) scale(1);
            filter: blur(0);
        }
        100% { 
            opacity: 0; 
            transform: translateX(-50%) translateY(-60px) scale(0.6);
            filter: blur(15px);
        }
    }
</style>
</head>
<body>

<!-- Мелкие анимированные сердечки по бокам -->
<div class="side-hearts">💕</div>
<div class="side-hearts right">💕</div>

<!-- SVG цветок слева сверху -->
<div class="side-element left-top">
    <svg viewBox="0 0 100 100" fill="none" stroke="#ff87c1" stroke-width="2">
        <circle cx="50" cy="50" r="8" fill="#ffb6d9"/>
        <circle cx="50" cy="20" r="6" fill="#ff4da6" opacity="0.8"/>
        <circle cx="30" cy="35" r="6" fill="#ff4da6" opacity="0.8"/>
        <circle cx="70" cy="35" r="6" fill="#ff4da6" opacity="0.8"/>
        <circle cx="30" cy="65" r="6" fill="#ff4da6" opacity="0.8"/>
        <circle cx="70" cy="65" r="6" fill="#ff4da6" opacity="0.8"/>
        <circle cx="50" cy="80" r="6" fill="#ff4da6" opacity="0.8"/>
        <path d="M50 50 L50 95" stroke="#ff87c1" stroke-width="1.5" opacity="0.6"/>
    </svg>
</div>

<!-- SVG звезда слева снизу -->
<div class="side-element left-bottom">
    <svg viewBox="0 0 100 100" fill="none" stroke="#ffb6d9" stroke-width="2">
        <path d="M50 10 L61 39 L92 39 L67 57 L78 86 L50 68 L22 86 L33 57 L8 39 L39 39 Z" fill="#ff4da6" opacity="0.9"/>
        <circle cx="50" cy="48" r="15" fill="none" stroke="#ff87c1" opacity="0.4"/>
    </svg>
</div>

<!-- SVG цветок справа сверху -->
<div class="side-element right-top">
    <svg viewBox="0 0 100 100" fill="none" stroke="#ff87c1" stroke-width="2">
        <circle cx="50" cy="50" r="8" fill="#ffb6d9"/>
        <circle cx="50" cy="20" r="6" fill="#ff4da6" opacity="0.8"/>
        <circle cx="30" cy="35" r="6" fill="#ff4da6" opacity="0.8"/>
        <circle cx="70" cy="35" r="6" fill="#ff4da6" opacity="0.8"/>
